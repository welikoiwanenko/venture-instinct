name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Gemini review is manual (gemini-review.yml); mark it "not requested" on each new
  # head so the required status only blocks when a requested review fails.
  gemini-review-default:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" -q '.statuses[] | select(.context == "gemini-review") | .state')
          if [ -n "$existing" ]; then echo "gemini-review already $existing"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success \
            -f context=gemini-review -f description="Not requested (comment /gemini-cli review)"
