name: Gemini Review

# Manual: comment `/gemini-cli review` on a PR (repo owner only), or run from the Actions tab.
# Reports the `gemini-review` commit status on the PR head; ci.yml sets it to success
# ("not requested") on every push, so it only blocks merging when a requested review fails.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

# Every PR comment starts a run of this workflow, even when the job below is skipped.
# Only authorized review requests share the per-PR group (a newer request supersedes
# an older one); any other comment gets a group of its own, so it can never cancel a
# running review. Keep this condition in sync with the job's `if` (minus its always()).
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/gemini-cli review') &&
          github.event.comment.author_association == 'OWNER'))
        && format('gemini-review-{0}', github.event.issue.number || inputs.pr)
        || format('gemini-review-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  review:
    # always(): on cancellation GitHub re-evaluates this condition and cancels the whole
    # job if it is false (a condition without a status function implies success()).
    # Keeping the job alive lets only its steps be cancelled, so `Report result`
    # (always()) still records the cancellation. For unrelated comments it stays false.
    if: >-
      always() && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/gemini-cli review') &&
       github.event.comment.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    # Step budgets: pending 2 + Gemini 8 + report 2 = 12 < 15, so a timed-out step is
    # always reported before the job deadline cancels the job.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark review pending
        id: pr
        timeout-minutes: 2
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -q '.[] | select(.user.login == "github-actions[bot]" and .submitted_at != null) | .id' | sort -n | tail -1)
          echo "last_review=${last:-0}" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=pending \
            -f context=gemini-review -f description="Gemini review running" -f target_url="$STATUS_URL"

      - name: Run Gemini pull request review
        id: gemini
        # A hung review fails this step instead of the job, so it is still reported.
        timeout-minutes: 8
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          # Read by the code-review extension's /pr-code-review prompt.
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
          ADDITIONAL_CONTEXT: >-
            src/ is the domain runtime (docs/design-doc.md §17.1): it must not import UI,
            persistence, network, Linear or other external services, and reads must not
            advance game time or consume the domain RNG. Node runs .ts directly, so only
            erasable TypeScript syntax is allowed (no enums, namespaces, parameter
            properties) and relative imports use the .ts extension. Exception:
            src/cli/** is a developer adapter and may read files, parse arguments and
            write to stdout/stderr; it must not duplicate domain rules and imports only
            from src/app/. src/tui/** is the terminal UI adapter (Ink + React, written
            with React.createElement since there is no JSX); it may use the terminal and
            the ink/react packages, but it holds no game rules and imports only from
            src/app/ and src/tui/ (test/tui-boundary.test.ts enforces this).
            src/main.ts prints one runtime line when run directly.
            docs/ is a Ukrainian design document: flag only internal contradictions,
            not style.
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Free tier: Pro has no quota and Flash allows ~20 requests/day (one review), so
          # default to Flash-Lite. Override with the GEMINI_MODEL repository variable.
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          workflow_name: gemini-review
          github_pr_number: ${{ env.PR_NUMBER }}
          settings: |-
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.27.0"],
                  "includeTools": ["add_comment_to_pending_review", "pull_request_read", "pull_request_review_write"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": {
                "exclude": ["run_shell_command", "write_file", "replace", "web_fetch", "google_web_search", "save_memory"]
              }
            }
          extensions: |
            ["https://github.com/gemini-cli-extensions/code-review"]
          prompt: /pr-code-review

      # Every run that set "pending" leaves a final state:
      # - success: a review from this run was posted on the head commit;
      # - success ("skipped"): the Gemini API quota is exhausted (HTTP 429), which is
      #   not a finding about the PR, so it does not block the merge;
      # - failure: Gemini failed, hit the 8-minute step timeout, or exited 0 without
      #   posting (e.g. turn limit hit);
      # - error: the run was cancelled (manually or by a newer review request). It is
      #   only written while the status still points at this run,
      #   so a newer request that already marked the commit pending is not overwritten.
      - name: Report result
        if: ${{ always() && steps.pr.outputs.sha }}
        timeout-minutes: 2
        run: |
          if [ "$JOB_STATUS" = cancelled ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
              -q '.statuses[] | select(.context == "gemini-review") | .target_url')
            if [ "$current" != "$STATUS_URL" ]; then echo "gemini-review now belongs to another run"; exit 0; fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=error \
              -f context=gemini-review -f description="Gemini review cancelled; comment /gemini-cli review to retry" \
              -f target_url="$STATUS_URL"
            exit 0
          fi
          posted=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and .submitted_at != null and .commit_id == \"$SHA\" and .id > $LAST_REVIEW) | .id" | wc -l)
          if [ "$OUTCOME" = success ] && [ "$posted" -gt 0 ]; then state=success; desc="Gemini review posted"
          elif printf '%s' "$GEMINI_ERROR" | grep -qiE '"code": ?429|RESOURCE_EXHAUSTED|exhausted your .*quota'; then
            state=success; desc="Skipped: Gemini API quota exhausted, retry later"
            echo "::warning title=Gemini review skipped::Gemini API quota exhausted; comment /gemini-cli review again after it resets."
          else state=failure; desc="Gemini review failed, timed out or posted nothing"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.pr.outputs.sha }}" -f state=$state \
            -f context=gemini-review -f description="$desc" -f target_url="$STATUS_URL"
        env:
          JOB_STATUS: ${{ job.status }}
          OUTCOME: ${{ steps.gemini.outcome }}
          GEMINI_ERROR: ${{ steps.gemini.outputs.error }}
          SHA: ${{ steps.pr.outputs.sha }}
          LAST_REVIEW: ${{ steps.pr.outputs.last_review }}
