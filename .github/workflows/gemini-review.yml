name: Gemini Review

# Manual: comment `/gemini-cli review` on a PR (repo owner only), or run from the Actions tab.
# Reports the `gemini-review` commit status on the PR head; ci.yml sets it to success
# ("not requested") on every push, so it only blocks merging when a requested review fails.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

concurrency:
  group: gemini-review-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/gemini-cli review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark review pending
        id: pr
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -q '.[] | select(.user.login == "github-actions[bot]" and .submitted_at != null) | .id' | sort -n | tail -1)
          echo "last_review=${last:-0}" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=pending \
            -f context=gemini-review -f description="Gemini review running" -f target_url="$STATUS_URL"

      - name: Run Gemini pull request review
        id: gemini
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          # Read by the code-review extension's /pr-code-review prompt.
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ env.PR_NUMBER }}
          ADDITIONAL_CONTEXT: >-
            src/ is the domain runtime (docs/design-doc.md §17.1): it must not import UI,
            persistence, network, Linear or other external services, and reads must not
            advance game time or consume the domain RNG. Node runs .ts directly, so only
            erasable TypeScript syntax is allowed (no enums, namespaces, parameter
            properties) and relative imports use the .ts extension. docs/ is a Ukrainian
            design document: flag only internal contradictions, not style.
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # Pro has no free-tier quota; the `flash` alias tracks the current Flash model.
          gemini_model: ${{ vars.GEMINI_MODEL || 'flash' }}
          workflow_name: gemini-review
          github_pr_number: ${{ env.PR_NUMBER }}
          settings: |-
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.27.0"],
                  "includeTools": ["add_comment_to_pending_review", "pull_request_read", "pull_request_review_write"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": {
                "exclude": ["run_shell_command", "write_file", "replace", "web_fetch", "google_web_search", "save_memory"]
              }
            }
          extensions: |
            ["https://github.com/gemini-cli-extensions/code-review"]
          prompt: /pr-code-review

      # The action can exit 0 without posting (e.g. turn limit hit), so require a review
      # submitted by this run. Cancelled runs (superseded by a newer one) report nothing.
      # An exhausted Gemini API quota (HTTP 429) is not a finding about the PR, so it
      # reports success ("skipped") instead of blocking the merge.
      - name: Report result
        if: ${{ !cancelled() && steps.pr.outputs.sha }}
        run: |
          posted=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and .submitted_at != null and .commit_id == \"$SHA\" and .id > $LAST_REVIEW) | .id" | wc -l)
          if [ "$OUTCOME" = success ] && [ "$posted" -gt 0 ]; then state=success; desc="Gemini review posted"
          elif printf '%s' "$GEMINI_ERROR" | grep -qiE '"code": ?429|RESOURCE_EXHAUSTED|exhausted your .*quota'; then
            state=success; desc="Skipped: Gemini API quota exhausted, retry later"
            echo "::warning title=Gemini review skipped::Gemini API quota exhausted; comment /gemini-cli review again after it resets."
          else state=failure; desc="Gemini review failed or posted nothing"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.pr.outputs.sha }}" -f state=$state \
            -f context=gemini-review -f description="$desc" -f target_url="$STATUS_URL"
        env:
          OUTCOME: ${{ steps.gemini.outcome }}
          GEMINI_ERROR: ${{ steps.gemini.outputs.error }}
          SHA: ${{ steps.pr.outputs.sha }}
          LAST_REVIEW: ${{ steps.pr.outputs.last_review }}
